[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spacebio-satellite"
dynamic = ["version"]
description = "Command-line satellite for SpaceBio: lend a little of your computer to collect public space-biology papers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jcleydsonsilva" }]
keywords = ["spacebio", "space biology", "citizen science", "literature", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.31",
    "keyring>=24",
    "platformdirs>=3",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.urls]
Homepage = "https://www.spacebio.space"
Repository = "https://github.com/jcleydsonsilva/spacebio_satellite"
Issues = "https://github.com/jcleydsonsilva/spacebio_satellite/issues"
Changelog = "https://github.com/jcleydsonsilva/spacebio_satellite/blob/main/CHANGELOG.md"

[project.scripts]
spacebio-satellite = "spacebio_satellite.cli:main"
sbsat = "spacebio_satellite.cli:main"

[tool.setuptools.dynamic]
version = { attr = "spacebio_satellite.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
